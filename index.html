<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14100d">
<title>Coffee Lab OS</title>
<style>
:root{
  --bg:#14100d; --bg2:#1c1612; --card:#241c16; --card2:#2d231b; --line:#3a2d23;
  --text:#f3e9dc; --mute:#a8957f; --accent:#e0a458; --accent2:#c9772f;
  --good:#7bc47f; --warn:#e8b04a; --bad:#e2674f; --blue:#6fb3d9;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,#2a1e15,var(--bg));position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;letter-spacing:.3px}
header h1 span{color:var(--accent)}
header p{margin:2px 0 0;color:var(--mute);font-size:12px}
main{max-width:760px;margin:0 auto;padding:12px 14px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent)}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
select,input[type=text],input[type=number],input[type=date],textarea{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit}
textarea{min-height:60px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font-family:inherit;font-size:14px;border:0;border-radius:12px;padding:10px 14px;background:var(--card2);color:var(--text);border:1px solid var(--line);cursor:pointer}
button:active{transform:scale(.98)}
button.pri{background:var(--accent);color:#1a1209;border-color:var(--accent);font-weight:700}
button.dng{color:var(--bad)}
button.sm{padding:7px 10px;font-size:12px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.row.n>*{flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  var end=steps[steps.length-1].t+55;
  var notes=[];
  if(e<-1.2)notes.push('Under-extraction risk (sour, hollow). Compensated: tighter ratio, longer bloom'+(n===5?', one extra pulse':'')+'. Add a gentle swirl after the bloom and pour a little higher (5-6 cm).');
  else if(e>1.2)notes.push('Over-extraction risk (bitter, dry). Compensated: wider ratio, shorter bloom, slower pulses. Keep pours low and centre-only, no swirl.');
  else notes.push('Balanced. Low kettle height (under 4 cm), gentle centre-dominant stream, no swirl during main pours.');
  notes.push(d.note);
  if(c.note)notes.push(c.note);
  if(B.method==='iced')notes.push('Japanese iced: put '+ice+' g of ice in the server and pour '+hot+' g hot water over the coffee.');
  return {c:c,cat:cat,d:d,e:e,ratio:ratio,total:total,hot:hot,ice:ice,steps:steps,bloomT:bloomT,end:end,notes:notes,base:base,rec:rec,kettle:r1(B.temp+d.tOff)};
}

var R=null;

function update(){
  R=compute();if(!R)return;
  var c=R.c;
  var okT=B.temp>=85&&B.temp<=90,okG=B.zp>=5.4&&B.zp<=7.4;
  $('#tempVal').textContent=B.temp.toFixed(1)+'\u00B0C';
  $('#bTempR').value=B.temp;
  $('#lawT').innerHTML=okT?'<span style="color:var(--good)">Inside Law 1 (85-90\u00B0C)</span>':'<span style="color:var(--warn)">Outside Law 1. This is an off-protocol brew.</span>';
  $('#lawG').innerHTML=okG?'<span style="color:var(--good)">Inside Law 2 (coarse range)</span>':'<span style="color:var(--warn)">Outside Law 2 (ZP6 5.4-7.4).</span>';
  $('#bDose').value=B.dose;
  $('#dialLbl').textContent=B.grinder==='zp6'?'ZP6 dial':'C3S clicks';
  var dial=$('#bDial');
  if(B.grinder==='zp6'){dial.step='0.1';dial.value=B.zp.toFixed(1)}else{dial.step='1';dial.value=zpToC3(B.zp)}
  $('#dialHint').textContent='Recommended: ZP6 '+R.rec.toFixed(1)+' / C3S '+zpToC3(R.rec)+' clicks';
  $$('#bGrinder button').forEach(function(b){b.classList.toggle('on',b.dataset.v===B.grinder)});
  $$('#bMethod button').forEach(function(b){b.classList.toggle('on',b.dataset.v===B.method)});

  var d=daysOff(c.roastDate);
  var info=['<span class="chip">'+esc(R.cat.label)+'</span>'];
  if(c.roastDate)info.push('<span class="chip '+(d!=null&&d<5?'warn':'good')+'">Roasted '+esc(c.roastDate)+(d!=null?' ('+d+' d off roast)':'')+'</span>');
  if(c.proc)info.push('<span class="chip">'+esc(c.proc)+'</span>');
  $('#bCoffeeInfo').innerHTML=info.join('');

  $('#bBig').innerHTML=
    '<div><b>'+(B.method==='iced'?R.hot:R.total)+'</b><small>'+(B.method==='iced'?'Hot water g':'Water g')+'</small></div>'+
    '<div><b>1:'+R.ratio.toFixed(2).replace(/0$/,'')+'</b><small>Ratio</small></div>'+
    '<div><b>'+R.kettle.toFixed(1)+'\u00B0</b><small>Kettle</small></div>'+
    this.raw=raw;
    var w=r1(raw-this.tareOff),now=performance.now();
    this.prevW=this.w;this.w=w;
    this.samples.push({t:now,w:w});
    while(this.samples.length&&now-this.samples[0].t>2500)this.samples.shift();
    var ref=null;
    for(var i=0;i<this.samples.length;i++){if(now-this.samples[i].t<=1500){ref=this.samples[i];break}}
    if(ref&&now-ref.t>400){
      var f=(w-ref.w)/((now-ref.t)/1000);
      this.flow=this.flow*0.5+clamp(f,-5,30)*0.5;
    }
    if($('#autoStart').checked&&!TM.running&&TM.acc===0&&w>=2&&this.prevW<1)TM.start();
    this.show();
  },
  show:function(){
    var w=this.w.toFixed(1),f=Math.abs(this.flow)<0.05?'0.0':this.flow.toFixed(1);
    $('#lvW').textContent=w;$('#lvF').textContent=f;$('#sW').textContent=w;$('#sF').textContent=f;
  },
  parse:function(arr){
    this.buf=this.buf.concat(arr);
    while(this.buf.length>=5){
      var i=-1;
      for(var k=0;k<this.buf.length-1;k++){if(this.buf[k]===0xEF&&this.buf[k+1]===0xDD){i=k;break}}
      if(i<0){this.buf=[];return}
      if(i>0)this.buf=this.buf.slice(i);
      var L=this.buf[3],total=3+L+2;
      if(this.buf.length<total)return;
      var p=this.buf.slice(0,total);this.buf=this.buf.slice(total);
      if(p[2]===0x0C&&(p[4]===5||p[4]===8)){
        var val=p[5]|(p[6]<<8)|(p[7]<<16);
        var unit=p[9]||1;
        val=val/Math.pow(10,unit);
        if(p[10]&0x02)val=-val;
        this.push(val);
      }
    }
  },
  write:async function(bytes){
    if(!this.wChar)return;
    var d=new Uint8Array(bytes);
      this.say('Choose scale\u2026');
      this.dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:this.SVC});
      var self=this;
      this.dev.addEventListener('gattserverdisconnected',function(){self.onDrop()});
      this.say('Connecting\u2026');
      var srv=await this.dev.gatt.connect();
      var svc=null;
      for(var i=0;i<this.SVC.length&&!svc;i++){try{svc=await srv.getPrimaryService(this.SVC[i])}catch(e){}}
      if(!svc)throw new Error('No Acaia-style service found');
      var chars=await svc.getCharacteristics();
      this.nChar=null;this.wChar=null;
      chars.forEach(function(c){
        self.log('char '+c.uuid+' '+Object.keys(c.properties).filter(function(k){return c.properties[k]}).join(','));
        if(c.uuid===self.NEW_N)self.nChar=c;
        if(c.uuid===self.NEW_W)self.wChar=c;
        if(c.uuid===self.OLD_C){self.nChar=c;self.wChar=c}
      });
      if(!this.nChar){chars.forEach(function(c){if(!self.nChar&&c.properties.notify)self.nChar=c;if(!self.wChar&&(c.properties.write||c.properties.writeWithoutResponse))self.wChar=c})}
      if(!this.nChar)throw new Error('No notify characteristic');
      await this.nChar.startNotifications();
      this.nChar.addEventListener('characteristicvaluechanged',function(ev){
        var a=Array.prototype.slice.call(new Uint8Array(ev.target.value.buffer));
        self.log(a.map(function(x){return ('0'+x.toString(16)).slice(-2)}).join(' '));
        self.parse(a);
      });
      this.connected=true;
      await this.write([0xEF,0xDD,0x0B,0x30,0x31,0x32,0x33,0x34,0x35,0x36,0x37,0x38,0x39,0x30,0x31,0x32,0x33,0x34,0x9A,0x6D]);
      await new Promise(function(r){setTimeout(r,300)});
      await this.write([0xEF,0xDD,0x0C,0x09,0x00,0x01,0x01,0x02,0x02,0x05,0x03,0x04,0x15,0x06]);
      this.hb=setInterval(function(){self.write([0xEF,0xDD,0x00,0x02,0x00,0x02,0x00])},3000);
      this.say('Connected: '+(this.dev.name||'scale'));
      toast('Scale connected');
    }catch(e){
      this.say('Failed: '+e.message);this.log('connect error: '+e.message);this.connected=false;
    }
  },
  onDrop:function(){clearInterval(this.hb);this.connected=false;this.say('Scale disconnected')},
  disconnect:function(){
    if(this.demo){clearInterval(this.demo);this.demo=null}
    if(this.dev&&this.dev.gatt.connected)this.dev.gatt.disconnect();
  runDemo:function(){
    var self=this;
    if(this.demo){clearInterval(this.demo);this.demo=null;this.say('Demo stopped');return}
    if(!R)return;
    this.tareOff=0;this.raw=0;this.w=0;this.prevW=0;this.samples=[];
    TM.reset();
    var t0=performance.now(),w=0;
    this.say('Demo running');
    this.demo=setInterval(function(){
      var t=(performance.now()-t0)/1000;
      var target=0;
      for(var i=0;i<R.steps.length;i++){if(t>=R.steps[i].t)target=R.steps[i].cum}
      var rate=target>w?7:0;
      w=Math.min(target,w+rate*0.1);
      if(t>R.end){clearInterval(self.demo);self.demo=null;self.say('Demo finished');return}
      self.push(w+(Math.random()-0.5)*0.1);
    },100);
  }
};
$('#scConnect').onclick=function(){SC.connect()};
$('#scDisc').onclick=function(){SC.disconnect()};
$('#scTare').onclick=function(){SC.tare()};
$('#scDemo').onclick=function(){SC.runDemo();go('brew')};

/* ---------- boot ---------- */
fillSelects();
if(B.coffeeId)resetToCoffee();
drawStars();
update();
draw();
renderPantry();

if('serviceWorker' in navigator){/* no service worker: keep the app a single file */}
})();
</script>
</body>
</html>
